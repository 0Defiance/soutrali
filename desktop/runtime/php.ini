; Runtime PHP embarqué Soutrali — configuration du paquet desktop tout-en-un.
; Copiée par desktop/build-package.ps1 dans desktop/runtime/php/php.ini.
; Seules les extensions livrées en DLL sont listées : les modules statiques
; (ctype, dom, filter, iconv, PDO, SimpleXML, session, tokenizer, xml, …)
; sont déjà présents dans ce binaire officiel de PHP 8.3 x64.
memory_limit=512M
post_max_size=32M
upload_max_filesize=32M
max_execution_time=120
date.timezone=Africa/Abidjan
default_charset="UTF-8"
error_reporting=E_ALL
display_errors=Off
log_errors=On
extension_dir="ext"
; Laravel 13 + base SQLite locale
extension=curl
extension=fileinfo
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=sodium
extension=zip
