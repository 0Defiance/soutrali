name: soutrali
description: Application Soutrali web puis Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  cookie_jar: ^4.0.8
  dio: ^5.9.0
  dio_cookie_manager: ^3.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.2.0
  go_router: ^16.2.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/
  fonts:
    # Charte §15.4 : titres Manrope, texte Source Sans 3 (licences OFL
    # 1.1 embarquées dans assets/fonts/).
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf